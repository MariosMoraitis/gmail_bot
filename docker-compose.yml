services:
  worker:
    build: .
    container_name: gmail-purger-worker
    command: python worker.py
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    container_name: gmail-purger-dashboard
    command: python app.py
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    ports:
      - "5005:5005"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
